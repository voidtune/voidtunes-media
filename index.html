
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoidTunes — Roblox Importer</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #090b14;
      color: white;
      font-family: system-ui, sans-serif;
    }
    main {
      width: min(420px, 86vw);
      padding: 24px;
      border: 1px solid #343b55;
      border-radius: 20px;
      background: #141827;
    }
    h1 { color: #a99aff; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      border-radius: 10px;
    }
    button {
      background: #9275ff;
      border: 0;
      color: white;
      font-weight: bold;
    }
    img {
      display: block;
      max-width: 100%;
      max-height: 220px;
      margin: 12px auto;
      border-radius: 10px;
    }
    #result { overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main>
  <h1>VoidTunes</h1>
  <p>Importer une image sur Roblox</p>

  <input id="file" type="file"
         accept="image/png,image/jpeg,image/bmp">

  <img id="preview" hidden alt="Aperçu de l'image">

  <button id="send">Importer sur Roblox</button>
  <p id="result">Choisis une image pour commencer.</p>
</main>

<script>
  // Remplace par l'adresse HTTPS de TON serveur déployé.
  const API_URL = "https://TON-SERVEUR.example.com";

  const fileInput = document.getElementById("file");
  const preview = document.getElementById("preview");
  const result = document.getElementById("result");
  const button = document.getElementById("send");

  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    if (!file) return;

    preview.src = URL.createObjectURL(file);
    preview.hidden = false;
    result.textContent = "Image prête à être importée.";
  });

  button.addEventListener("click", async () => {
    const file = fileInput.files[0];

    if (!file) {
      result.textContent = "Choisis d'abord une image.";
      return;
    }

    if (file.size > 10 * 1024 * 1024) {
      result.textContent = "Image trop volumineuse : maximum 10 Mo.";
      return;
    }

    button.disabled = true;
    result.textContent = "Envoi de l'image à Roblox…";

    try {
      const form = new FormData();
      form.append("image", file);

      const response = await fetch(`${API_URL}/api/upload`, {
        method: "POST",
        body: form
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Importation refusée.");
      }

      for (let i = 0; i < 30; i++) {
        await new Promise(resolve => setTimeout(resolve, 2000));

        const statusResponse = await fetch(
          `${API_URL}/api/status/${encodeURIComponent(data.operationId)}`
        );

        const status = await statusResponse.json();

        if (!statusResponse.ok) {
          throw new Error(status.error || "Erreur de vérification.");
        }

        if (status.done) {
          result.textContent =
            `ID Roblox : ${status.assetId} — ` +
            `Utilisation : ${status.image}`;

          return;
        }
      }

      result.textContent =
        "Import toujours en cours. Réessaie la vérification plus tard.";
    } catch (error) {
      result.textContent = error.message;
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
